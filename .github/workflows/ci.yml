name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores ficticios: el build y las pruebas unitarias no se conectan a servicios reales.
      NUXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NUXT_PUBLIC_SUPABASE_KEY: ci-placeholder-key
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      NETLIFY_DEV_EMULATION: "false"
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Cliente Prisma sin cambios
        run: git diff --exit-code -- layers/menu/generated

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas unitarias y de componentes
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  database:
    name: Migraciones y permisos (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      APP_DATABASE_URL: postgresql://heltifud_app:ci-only@localhost:5432/postgres
      NUXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NUXT_PUBLIC_SUPABASE_KEY: ci-placeholder-key
      NUXT_TELEMETRY_DISABLED: "1"
      # Los servicios importan con el alias `~~`; tsx lo resuelve con el tsconfig
      # de servidor que genera `nuxt prepare` (postinstall).
      TSX_TSCONFIG_PATH: .nuxt/tsconfig.server.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Roles de Supabase
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          SQL

      - name: Aplicar migraciones
        run: pnpm exec prisma migrate deploy

      - name: Habilitar el rol de la app (solo CI)
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE heltifud_app LOGIN PASSWORD 'ci-only'"

      - name: Verificar permisos, RLS e historial
        run: node --import tsx scripts/verify-database-hardening.ts

      # T24: servicios reales contra PostgreSQL, sin mocks de persistencia.
      # Estos scripts trabajan en una transacción que siempre se revierte.
      - name: Integración transaccional (alta, listado, personalización, pedido cliente, operación)
        run: |
          for script in order-create order-list order-personalization customer-order operations; do
            echo "::group::verify-$script"
            node --import tsx "scripts/verify-$script.ts"
            echo "::endgroup::"
          done

      # Idempotencia, workflow y concurrencia usan conexiones reales simultáneas,
      # así que necesitan una semana abierta confirmada. Solo en esta base desechable.
      - name: Sembrar semana abierta (solo CI)
        run: node --import tsx scripts/seed-ci-open-week.ts
        env:
          CI_DISPOSABLE_DATABASE: "1"

      - name: Integración concurrente (idempotencia, workflow, envío cliente)
        run: |
          for script in order-idempotency order-workflow customer-order-concurrency; do
            echo "::group::verify-$script"
            node --import tsx "scripts/verify-$script.ts"
            echo "::endgroup::"
          done
